# Native observed LIBERO metadata: 20 Hz, RGB 512x512, float32 state/action.
# libero_canonical.py derives dimensions and dtypes from a compatible server catalog.
# One next(loader) is one sample. True in *_is_pad means padded, not valid.
# No resizing, resampling, normalization, client task lookup or model processing.
batch_format: {type: canonical_sample, version: 2}
image_output: {enabled: false}
require_metadata: {fps: 20}
sampling:
  shuffle_seed: 42
  drop_n_first_frames: 0
  drop_n_last_frames: 7
windows:
  observation: {offsets: [0]}
  action: {start: 0, step: 1, count: 32}
fields:
  - target: [action]
    source: {column: action}
    window: action
    tensor: {shape: [32, 7], dtype: float32}
  - target: [observation.state]
    source: {column: observation.state}
    window: observation
    tensor: {shape: [1, 8], dtype: float32}
  - target: [observation.images.image]
    source: {column: observation.images.image}
    window: observation
    tensor: {shape: [1, 3, 512, 512], dtype: uint8}
  - target: [observation.images.wrist_image]
    source: {column: observation.images.wrist_image}
    window: observation
    tensor: {shape: [1, 3, 512, 512], dtype: uint8}
  - target: [task]
    source: {column: task}
    value_type: string
  - target: [frequency]
    source: {constant: 20}
    value_type: json
  - target: [action_is_pad]
    source:
      is_pad:
        fields: [[action]]
        reduction: equal
    tensor: {shape: [32], dtype: bool}
  - target: [state_is_pad]
    source:
      is_pad:
        fields: [[observation.state]]
        reduction: equal
    tensor: {shape: [1], dtype: bool}
  - target: [image_is_pad]
    source:
      is_pad:
        fields: [[observation.images.image], [observation.images.wrist_image]]
        reduction: equal
    tensor: {shape: [1], dtype: bool}
