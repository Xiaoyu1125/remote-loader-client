# Canonical v2：每个 HC 帧一个 sample；本请求没有 batch/sample/output 段。
# 数据集及版本仍由 training 配置与 scheduler 选择，不写入本声明。
# target 数组是明确的输出路径；本模板用单段路径保留原来的字面字段名，不自动分组/改名。
# shape 是单样本形状；保留 T 维，标量为 []；uint8 图像不在 SDK 中归一化。
# task 和 *_is_pad 必须是源真实提供的字段，本模板不保证某个生产数据集具备它们。
# 这里的 *_is_pad 是源列请求，不是 True=有效的 v2 temporal_mask；禁止冒充/伪造 padding mask。
# 若源缺少这些字段，须按实际源能力确认声明；SDK 不填空任务、不合成频率或默认 mask。
# 本模板显式关闭服务端图像处理，保留下方声明的原生 uint8 尺寸；模型处理由训练侧 processor 完成。
# 训练 batch_size 只属于本地 preprocess → collate，不影响网络一帧一个 sample。

batch_format: {type: canonical_sample, version: 2}
image_output: {enabled: false}
sampling:
  shuffle_seed: 42
  drop_n_first_frames: 0
  drop_n_last_frames: 7

windows:
  observation: {offsets: [0]}
  action: {start: 0, step: 1, count: 50}

fields:
  - target: ["observation.images.image"]
    source: {column: observation.images.image}
    window: observation
    tensor: {shape: [1, 3, 256, 256], dtype: uint8}
  - target: ["observation.images.wrist_image"]
    source: {column: observation.images.wrist_image}
    window: observation
    tensor: {shape: [1, 3, 256, 256], dtype: uint8}
  - target: ["observation.state"]
    source: {column: observation.state}
    window: observation
    tensor: {shape: [1, 8], dtype: float32}
  - target: ["action"]
    source: {column: action}
    window: action
    tensor: {shape: [50, 7], dtype: float32}
  - target: ["index"]
    source: {column: index}
    tensor: {shape: [], dtype: int64}
  - target: ["episode_index"]
    source: {column: episode_index}
    tensor: {shape: [], dtype: int64}
  - target: ["frame_index"]
    source: {column: frame_index}
    tensor: {shape: [], dtype: int64}
  - target: ["timestamp"]
    source: {column: timestamp}
    tensor: {shape: [], dtype: float32}
  - target: ["task_index"]
    source: {column: task_index}
    tensor: {shape: [], dtype: int64}
  - target: ["dataset_index"]
    source: {column: dataset_index}
    tensor: {shape: [], dtype: int64}
  - target: ["task"]
    source: {column: task}
    value_type: string
  - target: ["action_is_pad"]
    source: {column: action_is_pad}
    window: action
    tensor: {shape: [50], dtype: bool}
  - target: ["state_is_pad"]
    source: {column: state_is_pad}
    window: observation
    tensor: {shape: [1], dtype: bool}
  - target: ["image_is_pad"]
    source: {column: image_is_pad}
    window: observation
    tensor: {shape: [1], dtype: bool}
