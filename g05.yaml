# G05 LIBERO input projection.
# Select the dataset in training settings; this file defines output fields and windows.
# Use it with a training project that expects the shapes and mask conventions below.
# Apply model-specific normalization, resizing, and prompt processing exactly once.

batch_format: {type: canonical_sample, version: 2}
image_output: {enabled: false}
require_metadata: {fps: 20}
sampling:
  shuffle_seed: 42
  drop_n_first_frames: 0
  # G05 requires the complete observation window through +32 and action window through +31.
  drop_n_last_frames: 32

windows:
  observation: {offsets: [0, 4, 8, 12, 16, 20, 24, 28, 32]}
  action: {start: 0, step: 1, count: 32}

fields:
  - target: ["observation.state"]
    source: {column: observation.state}
    window: observation
    tensor: {shape: [9, 8], dtype: float32}
  - target: ["action"]
    source: {column: action}
    window: action
    tensor: {shape: [32, 7], dtype: float32}

  # Keep source uint8 pixels; apply model-required image processing in the training project.
  - target: ["observation.images.image"]
    source: {column: observation.images.image}
    window: observation
    tensor: {shape: [9, 3, 512, 512], dtype: uint8}
  - target: ["observation.images.wrist_image"]
    source: {column: observation.images.wrist_image}
    window: observation
    tensor: {shape: [9, 3, 512, 512], dtype: uint8}

  # True marks padding; convert this mask only when the model expects another convention.
  - target: ["action_is_pad"]
    source:
      is_pad:
        fields: [["action"]]
        reduction: equal
    tensor: {shape: [32], dtype: bool}
  - target: ["state_is_pad"]
    source:
      is_pad:
        fields: [["observation.state"]]
        reduction: equal
    tensor: {shape: [9], dtype: bool}
  - target: ["image_is_pad"]
    source:
      is_pad:
        fields:
          - ["observation.images.image"]
          - ["observation.images.wrist_image"]
        reduction: equal
    tensor: {shape: [9], dtype: bool}

  - target: ["task"]
    source:
      index_column: task_index
      lookup: {table: tasks, key_column: task_index, value_column: task}
    value_type: string

  # Dataset index supplied with the selected training data.
  - target: ["dataset_index"]
    source: {column: dataset_index}
    tensor: {shape: [], dtype: int64}

  # Row identity fields available to the training input.
  - target: ["index"]
    source: {column: index}
    tensor: {shape: [], dtype: int64}
  - target: ["episode_index"]
    source: {column: episode_index}
    tensor: {shape: [], dtype: int64}
  - target: ["frame_index"]
    source: {column: frame_index}
    tensor: {shape: [], dtype: int64}
  - target: ["timestamp"]
    source: {column: timestamp}
    tensor: {shape: [], dtype: float32}
  - target: ["task_index"]
    source: {column: task_index}
    tensor: {shape: [], dtype: int64}
